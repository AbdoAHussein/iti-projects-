    <!-- task3 -->
    <div class="container-fluid">
        <div class="container py-5" >
            <form style="background-color: rgb(115, 114, 114);
            padding: 20px;
            border-radius: 10px;">
                <h1 style="text-align: center; margin-bottom: 20px;">CRUD System</h1>
                <input type="text" name="productName" id="productName" placeholder="Product Name" style="width: 100%; padding: 5px; margin-bottom: 10px; border-radius: 4px; border:none">
                <br>
                <input type="text" name="productPrice" id="productPrice" placeholder="Product Price" style="width: 100%; padding: 5px; margin-bottom: 10px; border-radius: 4px; border:none">
                <br>
                <input type="text" name="productCategory" id="productCategory" placeholder="Product Category" style="width: 100%; padding: 5px; margin-bottom: 10px; border-radius: 4px; border:none">
                <br>
                <textarea name="productDescription" id="productDescription" placeholder="Product Description" style="width: 100%; padding: 5px; margin-bottom: 10px; border-radius: 4px; border:none"></textarea>
                <br>
                <input type="file" name="productImage" id="productImage" placeholder="Product Image" style="width: 100%; padding: 5px; margin-bottom: 10px; border-radius: 4px; background-color: white;">
                <br>
                <button type="submit" class="btn btn-primary productBtn">Add Product</button>
            </form>
            <input type="search" name="searchProduct" id="searchProduct" placeholder="Search Products" style="width: 100%; padding: 5px; margin-top: 20px; margin-bottom: 10px; border-radius: 4px;">
        </div>
        <div id="productOutput" class="container py-5">

        </div>
    </div>
    <script src="./js/script.js"></script>
